# Demo: implement a triaged bug as a fast follow-up. When an open issue carries both `bug` (the triage
# sets it) and `ready-to-implement` (alvazjor adds it), a Strands agent makes a small change and opens
# a DRAFT pull request on the fork. No build, no tests, no gate: the agent
# writes the branch, the commit and the pull request itself (create_branch, push_files,
# create_pull_request are its only write tools).
version: 1
enabled: true
description: Implement an open issue labeled both bug and ready-to-implement, in either order, and open a draft PR on the fork, with no build, tests or gate.

on:
  platform: github
  entity: issue
  action: labeled
  filter: "workflow.input.data.state == 'open' && 'bug' in workflow.input.data.labels && 'ready-to-implement' in workflow.input.data.labels && workflow.input.raw.label.name in ['bug', 'ready-to-implement'] && workflow.input.actor in ['alvazjor', 'trellis-poc']"  # the second of the two labels was just added, by alvazjor or the triage
  self_events: [issue]                 # the triage sets `bug` as trellis-poc, Trellis's own login
  ignore_global_filter: true           # routing.user_filter passes only alvazjor; the filter above also allows trellis-poc
  concurrency:
    group: implement-${workflow.input.subject.number}
    policy: cancel-outdated            # both labels added at once: the later event's run replaces the earlier one

steps:
  - id: implement
    kind: agent
    agent: strands/implementer
    instruction: |
      Implement the issue in your inputs and open a draft pull request, as your agent instructions
      describe. Submit pr_url, branch and summary.
    in:
      owner: alvazjor
      repo: aws-cdk
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      body: ${workflow.input.raw.issue.body}
      url: ${workflow.input.raw.issue.html_url}
      branch: trellis/implement-issue-${workflow.input.subject.number}
    out:
      pr_url: string
      branch: string
      summary: string
