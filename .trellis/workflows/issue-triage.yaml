# Demo: triage a new issue on alvazjor's CDK fork with the CDK issue triage skill
# (.trellis/skills/cdk-issue-triage.md, built into the triager agent by scripts/build-triager.py).
# First `notice` comments on the issue that the triage has started. The agent then reads the issue and aws/aws-cdk through the GitHub MCP server and PROPOSES two writes on
# the fork issue: the label change and the triage comment. A person sees both proposals at the gate;
# on approve, `apply` performs them on the fork. A reject ends the run and nothing is written.
version: 1
enabled: true
description: Tell the author the triage has started, triage the issue with the CDK issue triage skill; after approval at the gate, set the proposed labels and post the triage comment on the fork issue.

on:
  platform: github
  entity: issue
  action: [opened, reopened]
  filter: "workflow.input.data.state == 'open'"

steps:
  # Tells the author, as trellis-poc, that the triage has started, a few seconds after the issue opens.
  - id: notice
    kind: deterministic
    in:
      repo: ${workflow.input.source}
      number: ${workflow.input.subject.number}
      author: ${workflow.input.data.author}
    run:
      - |
        gh issue comment "${in.number}" --repo "${in.repo}" --body "Hi @${in.author},

        Thanks for opening this issue. We are triaging it now: we read the report, look for duplicates and existing fixes, check the CDK source and docs for the cause, and try a quick reproduction when the issue allows it. Once a maintainer has reviewed the findings, we will reply here with what we found, the next steps and the labels."

  - id: triage
    kind: agent
    depends_on: [notice]
    agent: strands/triager
    instruction: |
      Triage the GitHub issue in your inputs with the CDK issue triage skill, as your agent
      instructions describe. Propose the label change with github_issue_write and the comment with
      github_add_issue_comment (both proposal-only), then submit every output: track, classification, priority, reproduction, labels_added and
      labels_removed (comma separated, empty when none), summary (two or three sentences), comment
      (the Proposed Response, the same text you proposed) and report (the full triage report).
    in:
      owner: alvazjor
      repo: aws-cdk
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      author: ${workflow.input.data.author}
      labels: ${workflow.input.data.labels}
      url: ${workflow.input.subject.url}
    allowed_proposals:
      - github_issue_write
      - github_add_issue_comment
    out:
      track: enum[already-fixed, duplicate, feature-request-with-pr, security, synth-time-bug, missing-context, full-triage]
      classification: enum[bug, feature, docs, question, working-as-intended]
      priority: enum[p1, p2, none]
      reproduction: enum[reproduced, not-reproduced, not-attempted]
      labels_added: string
      labels_removed: string
      summary: string
      comment: string
      report: artifact

  # The person sees the triage and both proposals (labels and comment) here, and approves or rejects
  # in the Trellis UI. A reject ends the run here: nothing is written.
  - id: approve
    kind: gate
    depends_on: [triage]
    in:
      issue: ${workflow.input.subject.url}
      summary: ${step.triage.summary}
      track: ${step.triage.track}
      classification: ${step.triage.classification}
      priority: ${step.triage.priority}
      reproduction: ${step.triage.reproduction}
      labels_added: ${step.triage.labels_added}
      labels_removed: ${step.triage.labels_removed}
      comment: ${step.triage.comment}
      proposals: ${step.triage.proposals}
    out:
      outcome: enum[approve, reject]
      feedback: string

  # Performs what the gate approved, in the order the agent proposed it: the label change and the
  # comment on the fork issue.
  - id: apply
    kind: deterministic
    depends_on: [approve]
    in:
      proposals: ${step.approve.approved}
    run:
      - ${in.proposals}
