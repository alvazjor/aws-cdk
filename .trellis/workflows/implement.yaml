# Demo: implement a triaged bug as a fast follow-up. When an open issue carries both `bug` (the triage
# sets it) and `ready-to-implement` (alvazjor adds it), a Strands agent makes a small change and
# PROPOSES the branch, the commit and a draft pull request on the fork. A person approves them at the
# gate approve_pr (Slack announces the hold); open_pr then performs them. No build, no tests.
version: 1
enabled: true
description: Implement an open issue labeled both bug and ready-to-implement, in either order, and open a draft PR on the fork after approval at a gate. No build, no tests.

on:
  platform: github
  entity: issue
  action: labeled
  # Starts when the second of the two labels is added, by alvazjor or by the triage (trellis-poc):
  # the issue is open, has both labels, the label just added is one of them, and the actor is one of the two.
  filter: >-
    workflow.input.data.state == 'open'
    && 'bug' in workflow.input.data.labels
    && 'ready-to-implement' in workflow.input.data.labels
    && workflow.input.raw.label.name in ['bug', 'ready-to-implement']
    && workflow.input.actor in ['alvazjor', 'trellis-poc']
  self_events: [issue]                 # the triage sets `bug` as trellis-poc, Trellis's own login
  ignore_global_filter: true           # routing.user_filter passes only alvazjor; the filter above also allows trellis-poc
  concurrency:
    group: implement-${workflow.input.subject.number}
    policy: cancel-outdated            # both labels added at once: the later event's run replaces the earlier one

steps:
  - id: implement
    kind: agent
    agent: strands/implementer
    instruction: |
      Implement the issue in your inputs and open a draft pull request, as your agent instructions
      describe: propose the branch, the commit and the draft pull request, then submit branch, title
      and summary.
    in:
      owner: alvazjor
      repo: aws-cdk
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      body: ${workflow.input.raw.issue.body}
      url: ${workflow.input.raw.issue.html_url}
      branch: trellis/implement-issue-${workflow.input.subject.number}
    allowed_proposals:
      - github_create_branch
      - github_push_files
      - github_create_pull_request
    out:
      branch: string
      title: string
      summary: string

  # The person sees the proposed branch, commit (every changed file) and pull request here, and
  # approves or rejects in the Trellis UI; the hold is posted to Slack. A reject ends the run and
  # nothing is written.
  - id: approve_pr
    kind: gate
    depends_on: [implement]
    in:
      issue: ${workflow.input.raw.issue.html_url}
      title: ${step.implement.title}
      branch: ${step.implement.branch}
      summary: ${step.implement.summary}
      proposals: ${step.implement.proposals}
    out:
      outcome: enum[approve, reject]
      feedback: string

  # Performs what the gate approved, in order: the branch, the commit, the draft pull request.
  - id: open_pr
    kind: deterministic
    depends_on: [approve_pr]
    in:
      proposals: ${step.approve_pr.approved}
    run:
      - ${in.proposals}
