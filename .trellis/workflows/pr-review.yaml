# Demo: review a pull request on alvazjor's CDK fork. Nothing is posted to GitHub yet: the agent
# writes its review as step output, a person approves it at the gate, and the last step only logs
# the review it would post. Posting is added later.
version: 1
enabled: false
description: Review a pull request into main with a Strands agent, hold the review at a gate, then log the review it would post.

on:
  platform: github
  entity: pull_request
  action: [opened, reopened, synchronize, ready_for_review]
  branches: [main]
  filter: "workflow.input.data.state == 'open'"  # not a draft, not closed or merged
  # The default: new commits on the pull request cancel the review of the older ones.
  concurrency:
    group: pr-${workflow.input.subject.number}
    policy: cancel-outdated

steps:
  - id: review
    kind: agent
    agent: strands/reviewer
    instruction: |
      Review the pull request in your inputs, as your agent instructions describe. Fill every output:
      verdict, blocking (the number of findings that must change before merge), summary (two or
      three sentences) and review (the review body a maintainer would post, in Markdown).
    in:
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      author: ${workflow.input.data.author}
      base_branch: ${workflow.input.data.base_branch}
      head_branch: ${workflow.input.data.head_branch}
      head_sha: ${workflow.input.data.head_sha}
      body: ${workflow.input.raw.pull_request.body}
      url: ${workflow.input.subject.url}
    out:
      verdict: enum[approve, comment, request-changes]
      blocking: int
      summary: string
      review: string

  # The person sees the review here and approves or rejects it in the Trellis UI.
  - id: approve
    kind: gate
    depends_on: [review]
    in:
      pull_request: ${workflow.input.subject.url}
      verdict: ${step.review.verdict}
      summary: ${step.review.summary}
      review: ${step.review.review}
    out:
      outcome: enum[approve, reject]
      feedback: string

  # Runs after an approve. A reject ends the run at the gate, with the person's feedback.
  - id: would_post
    kind: deterministic
    depends_on: [approve]
    in:
      number: ${workflow.input.subject.number}
      verdict: ${step.review.verdict}
      review: ${step.review.review}
    run: |
      echo "would post: a ${in.verdict} review on pull request #${in.number}:"
      printf '%s\n' "${in.review}"

