# Trellis for the demo on alvazjor's CDK fork.
engine:
  max_concurrent_runs: 2
  step_timeout_seconds: 1800                             # 30 minutes per step attempt
github:
  repository: alvazjor/aws-cdk
  self_logins: [trellis-poc]                             # Trellis acts as trellis-poc (secrets/github-bot.token); its own events are dropped
webhook:
  port: 8782                                             # the GitHub forward delivers here
routing:
  user_filter: "workflow.input.actor == 'alvazjor'"      # only events alvazjor causes start runs
store:
  path: /tmp/trellis-demo-runs/trellis.db                # run database; run clones and agent copies go in its folder
sweep:
  interval_seconds: 1800                                 # checks GitHub for missed events every 30 minutes
providers:
  default: bedrock-demo
  entries:
    - name: bedrock-demo
      type: bedrock                                      # account 963884676929 (ada-cdk)
      region: us-east-1
      credential: { source: aws-default-chain }          # served by demo.sh's loopback credential endpoint
