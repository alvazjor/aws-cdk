# Trellis for the demo on alvazjor's CDK fork. The daemon runs from this checkout through
# /workplace/alvazjor/trellis-demo/scripts/demo.sh; the runbook is trellis-demo/reports/demo-runbook.md.
engine:
  max_concurrent_runs: 2
  step_timeout_seconds: 1800
github:
  repository: alvazjor/aws-cdk
  self_logins: [alvazjor]
webhook:
  port: 8782
store:
  path: /tmp/trellis-demo-runs/trellis.db
sweep:
  interval_seconds: 1800
providers:
  default: bedrock-demo
  entries:
    # Account 963884676929 (ada-cdk). The credential reaches the agents through the loopback
    # credential endpoint demo.sh starts (AWS_CONTAINER_CREDENTIALS_FULL_URI).
    - name: bedrock-demo
      type: bedrock
      region: us-east-1
      credential: { source: aws-default-chain }
