# Demo: triage a new issue on alvazjor's CDK fork with the CDK issue triage skill
# (.trellis/skills/cdk-issue-triage.md, built into the triager agent by scripts/build-triager.py).
# First `notice` comments on the issue that the triage has started. The agent then reads the issue
# and aws/aws-cdk through the GitHub MCP server, sets the labels and posts the triage comment on the
# fork issue itself. No gate: nothing is reviewed before it is written.
version: 1
enabled: true
description: Tell the author the triage has started, triage the issue with the CDK issue triage skill, then set the labels and post the triage comment on the fork issue.

on:
  platform: github
  entity: issue
  action: [opened, reopened]
  filter: "workflow.input.data.state == 'open'"

steps:
  # Tells the author, as trellis-poc, that the triage has started, a few seconds after the issue opens.
  - id: notice
    kind: deterministic
    in:
      repo: ${workflow.input.source}
      number: ${workflow.input.subject.number}
      author: ${workflow.input.data.author}
    run:
      - |
        gh issue comment "${in.number}" --repo "${in.repo}" --body "Hi @${in.author},

        Thanks for opening this issue. We are triaging it now: we read the report, look for duplicates and existing fixes, check the CDK source and docs for the cause, and try a quick reproduction when the issue allows it. We will reply here shortly with what we found, the next steps and the labels."

  - id: triage
    kind: agent
    depends_on: [notice]
    agent: strands/triager
    instruction: |
      Triage the GitHub issue in your inputs with the CDK issue triage skill, as your agent
      instructions describe. Set the labels with github_issue_write and post the comment with
      github_add_issue_comment, then submit every output: track, classification, priority, reproduction, labels_added and
      labels_removed (comma separated, empty when none), summary (two or three sentences), comment
      (the Proposed Response, the same text you posted) and report (the full triage report).
    in:
      owner: alvazjor
      repo: aws-cdk
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      author: ${workflow.input.data.author}
      labels: ${workflow.input.data.labels}
      url: ${workflow.input.subject.url}
    out:
      track: enum[already-fixed, duplicate, feature-request-with-pr, security, synth-time-bug, missing-context, full-triage]
      classification: enum[bug, feature, docs, question, working-as-intended]
      priority: enum[p1, p2, none]
      reproduction: enum[reproduced, not-reproduced, not-attempted]
      labels_added: string
      labels_removed: string
      summary: string
      comment: string
      report: artifact
