# Stand-in for aws/aws-cdk's AWS Service Spec Update workflow, for the Trellis spec-update-note test on this
# fork only. It skips the spec build: it uploads the saved PR.md of one upstream run (input `run`, files in
# .github/spec-update-test/<run>/PR.md) and opens or updates the pull request on automation/spec-update as
# the real workflow does, with the same job name and action, so Trellis sees the same artifact and log line.
# Started by hand.
name: AWS Service Spec Update
on:
  workflow_dispatch:
    inputs:
      run:
        description: The upstream run id whose saved PR.md to use
        required: true
jobs:
  pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check Out
        uses: actions/checkout@v7
      - name: Upload PR body file
        uses: actions/upload-artifact@v7
        with:
          name: PR.md
          path: .github/spec-update-test/${{ inputs.run }}/PR.md
      - name: Make a change
        run: date -u > .github/spec-update-test/last-run.txt
      - name: Make Pull Request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/spec-update
          title: "feat: update L1 CloudFormation resource definitions"
          commit-message: "feat: update L1 CloudFormation resource definitions"
          body-path: .github/spec-update-test/${{ inputs.run }}/PR.md
