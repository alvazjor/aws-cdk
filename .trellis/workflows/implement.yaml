# Demo: implement a triaged bug as a fast follow-up. When an open issue carries both `bug` (the triage
# sets it) and `ready-to-implement` (alvazjor adds it), a Strands agent makes a small change and opens
# a DRAFT pull request on the fork. No build, no tests, no gate: the agent
# writes the branch, the commit and the pull request itself (create_branch, push_files,
# create_pull_request are its only write tools).
version: 1
enabled: true
description: Implement an open issue labeled both bug and ready-to-implement, in either order, open a draft PR on the fork with no build or tests, and hold at review_pr so Slack announces it.

on:
  platform: github
  entity: issue
  action: labeled
  # Starts when the second of the two labels is added, by alvazjor or by the triage (trellis-poc):
  # the issue is open, has both labels, the label just added is one of them, and the actor is one of the two.
  filter: >-
    workflow.input.data.state == 'open'
    && 'bug' in workflow.input.data.labels
    && 'ready-to-implement' in workflow.input.data.labels
    && workflow.input.raw.label.name in ['bug', 'ready-to-implement']
    && workflow.input.actor in ['alvazjor', 'trellis-poc']
  self_events: [issue]                 # the triage sets `bug` as trellis-poc, Trellis's own login
  ignore_global_filter: true           # routing.user_filter passes only alvazjor; the filter above also allows trellis-poc
  concurrency:
    group: implement-${workflow.input.subject.number}
    policy: cancel-outdated            # both labels added at once: the later event's run replaces the earlier one

steps:
  - id: implement
    kind: agent
    agent: strands/implementer
    instruction: |
      Implement the issue in your inputs and open a draft pull request, as your agent instructions
      describe. Submit pr_url, branch and summary.
    in:
      owner: alvazjor
      repo: aws-cdk
      number: ${workflow.input.subject.number}
      title: ${workflow.input.data.title}
      body: ${workflow.input.raw.issue.body}
      url: ${workflow.input.raw.issue.html_url}
      branch: trellis/implement-issue-${workflow.input.subject.number}
    out:
      pr_url: string
      branch: string
      summary: string

  # A notification for the open draft PR: the hold posts to Slack with the issue link, and the gate
  # panel shows the PR link and the summary. Nothing runs after it; approve or reject only ends the run.
  - id: review_pr
    kind: gate
    depends_on: [implement]
    in:
      pull_request: ${step.implement.pr_url}
      branch: ${step.implement.branch}
      summary: ${step.implement.summary}
      issue: ${workflow.input.raw.issue.html_url}
    out:
      outcome: enum[approve, reject]
      feedback: string
